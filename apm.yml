name: gem-team
version: 1.106.0
description: >-
  Self-Learning Multi-agent orchestration harness for spec-driven development
  and automated verification.
author: mubaidr
license: Apache-2.0
includes:
  - .apm/agents
  - .apm/skills
dependencies:
  apm: []
  mcp: []
scripts:
  check: apm marketplace check && apm pack --check-versions --check-clean --dry-run && apm audit --ci --no-policy
  pack: apm pack --check-versions --archive
marketplace:
  owner:
    name: mubaidr
    url: https://github.com/mubaidr
    email: mubaidr@gmail.com
  versioning:
    strategy: lockstep
  metadata:
    homepage: https://github.com/mubaidr/gem-team
  packages:
    - name: gem-team
      description: >-
        Self-Learning Multi-agent orchestration harness for spec-driven
        development and automated verification
      source: ./
      tags:
        - multi-agent
        - orchestration
        - tdd
        - testing
        - e2e
        - devops
        - security-audit
        - code-review
        - prd
        - mobile
