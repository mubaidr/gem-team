name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Uses the manifest file to determine versions
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

      - name: Checkout release tag
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Set up APM
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: microsoft/apm-action@v1
        with:
          setup-only: "true"
          apm-version: "0.28.0"

      - name: Validate and package release
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          apm run check
          apm run pack
          for archive in build/*.zip; do
            sha256sum "$archive" > "$archive.sha256"
          done

      - name: Attach APM artifacts to release
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" build/*.zip build/*.zip.sha256 --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
