name: Validate APM Package

on:
  pull_request:
    paths:
      - ".apm/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/package.yml"
      - "apm.yml"
  push:
    branches:
      - main
    paths:
      - ".apm/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/package.yml"
      - "apm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up APM
        uses: microsoft/apm-action@v1
        with:
          setup-only: "true"
          apm-version: "0.28.0"

      - name: Validate package and marketplace
        run: apm run check
