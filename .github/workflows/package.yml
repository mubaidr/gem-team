name: Validate APM Package

on:
  pull_request:
    paths:
      - ".apm/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/package.yml"
      - "apm.yml"
  push:
    branches:
      - main
    paths:
      - ".apm/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/package.yml"
      - "apm.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up APM
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          setup-only: "true"
          apm-version: "0.28.0"

      - name: Validate package and marketplace
        run: apm run check
