  reason: Reviewer found that downstream tasks lacked a deterministic shared critic input schema and final checks were vague.
  changed_tasks:
    - reviewer-contract
    - orchestrator-routing
    - planner-contract
    - package-and-doc-validation
  added_tasks: []
  removed_tasks: []
  preserved_acceptance_criteria:
    - Existing plan/wave/full remain valid
    - Critic mode has explicit input/output
    - Routing and docs are covered
  new_risks:
    - Schema drift between reviewer, orchestrator, and planner
    - Validation may pass without checking all required contract references
  progress_signal: Critic fields are named identically in all three contracts and validation lists exact grep/build commands with expected zero-failure outcomes.

open_questions: []
assumptions:
  - The four critic intents are discuss, proposal, feature_idea, and challenge.
  - The existing plan, wave, and full common output fields are consumed by callers and must remain stable.
  - A critic result can use the existing pass, warning, or blocking verdict and add critic-specific structured fields.
  - APM compile is the authoritative check for packaged agent definitions and generated targets.

tasks:
  - id: reviewer-contract
    title: Define additive reviewer critic contract
    description: >-
      Extend the gem-reviewer agent definition with an additive critic branch
      for discussion, proposal, feature idea, and critical challenge requests.
      Define the exact required critic_subject and critic_context input schema,
      read-only boundaries, structured challenge categories, decision-blocker
      handling, and measurable output while
      retaining the existing plan, wave, and full workflow and output contract.
    wave: 1
    agent: gem-implementer
    status: pending
    flags:
      requires_design_validation: false
      retries_used: 0
      revision_reason: ""
    acceptance_criteria:
      - ".apm/agents/gem-reviewer.agent.md accepts review_mode: critic in addition to plan, wave, and full."
      - "Critic input uses exactly critic_subject {objective: string, proposal: string, constraints: string[], alternatives: string[], evidence: string[], decision_needed: string} and critic_context {audience: string, time_horizon: string, success_criteria: string[], known_unknowns: string[]}; all fields are required for critic mode."
      - "Critic output preserves common reviewer fields and defines critic_verdict plus structured challenges, alternatives, and decision_blockers with evidence, impact, and action for each reported challenge."
      - "The critic branch states that it is read-only and does not implement, mutate files, or claim completion of proposed work."
      - "The plan, wave, and full parsing and output requirements remain present and do not require critic-only fields."
    handoff:
      known_context:
        - "Current reviewer parses only plan, wave, and full at .apm/agents/gem-reviewer.agent.md:27."
        - "The requested critic mode is additive and must cover discussions, proposals, feature ideas, and critical challenge."
        - "The authoritative critic input schema is critic_subject {objective, proposal, constraints, alternatives, evidence, decision_needed} and critic_context {audience, time_horizon, success_criteria, known_unknowns}."
        - "Critic output must make challenges and decision blockers measurable, not only provide free-form prose."
      constraints:
        - "Preserve existing mode names and common JSON output fields."
        - "Use ASCII-only text and no source implementation outside the agent contract."
    requires_review: true
    review_depth: lightweight
    review_security_sensitive: false

  - id: orchestrator-routing
    title: Route critic intents and expose reviewer inputs
    description: >-
      Update gem-orchestrator intent routing and agent_input_reference so the
      four critic intents can invoke gem-reviewer with review_mode critic and
      exactly critic_subject {objective, proposal, constraints, alternatives,
      evidence, decision_needed} plus critic_context {audience, time_horizon,
      success_criteria, known_unknowns}. Preserve existing plan, wave, and full
      routing, config snapshot forwarding, and HIGH reviewer validation behavior.
    wave: 2
    agent: gem-implementer
    depends_on:
      - reviewer-contract
    status: pending
    flags:
      requires_design_validation: false
      retries_used: 0
      revision_reason: ""
    acceptance_criteria:
      - "gem-orchestrator routes discuss, proposal, feature_idea, and challenge intent to gem-reviewer with review_mode: critic."
      - "gem-orchestrator agent_input_reference lists the exact required objects critic_subject {objective: string, proposal: string, constraints: string[], alternatives: string[], evidence: string[], decision_needed: string} and critic_context {audience: string, time_horizon: string, success_criteria: string[], known_unknowns: string[]}; these names match reviewer-contract with no aliases."
      - "Existing plan, wave, and full route conditions remain valid and are not renamed, removed, or made dependent on critic-only fields."
      - "planning.enable_critic_for remains part of the routing decision as reviewer validation, with HIGH behavior preserved."
      - "The handoff states that critic mode is read-only and that the reviewer receives the full config_snapshot."
    handoff:
      known_context:
        - "Current intent inference mentions discuss but does not expose proposal, feature_idea, or challenge reviewer routing."
        - "Current gem-reviewer input reference allows review_mode only as plan, wave, or full."
        - "Reviewer contract task defines the authoritative critic field names and output shape: critic_subject {objective, proposal, constraints, alternatives, evidence, decision_needed} and critic_context {audience, time_horizon, success_criteria, known_unknowns}."
      constraints:
        - "Depend on reviewer-contract output; do not invent a second critic schema."
        - "Preserve the compatibility meaning of planning.enable_critic_for."
    requires_review: true
    review_depth: lightweight
    review_security_sensitive: false

  - id: planner-contract
    title: Align planner reviewer task schema
    description: >-
      Update the gem-planner definition or its reviewer task schema where
      needed so plans can express a critic reviewer task with exactly
      critic_subject {objective, proposal, constraints, alternatives, evidence,
      decision_needed} and critic_context {audience, time_horizon,
      success_criteria, known_unknowns}, without weakening the existing plan,
      wave, and full reviewer task contracts. Keep critic fields branch-specific
      and preserve measurable acceptance criteria and handoff boundaries.
    wave: 2
    agent: gem-implementer
    depends_on:
      - reviewer-contract
    status: pending
    flags:
      requires_design_validation: false
      retries_used: 0
      revision_reason: ""
    acceptance_criteria:
      - "gem-planner recognizes review_mode: critic as an allowed reviewer task mode while retaining plan, wave, and full."
      - "Planner guidance identifies exactly critic_subject {objective: string, proposal: string, constraints: string[], alternatives: string[], evidence: string[], decision_needed: string} and critic_context {audience: string, time_horizon: string, success_criteria: string[], known_unknowns: string[]} and requires them only for critic mode, with no aliases."
      - "The planner schema continues to require explicit task ownership, dependencies, waves, and handoff constraints for reviewer tasks."
      - "No standalone gem-critic agent or planner route is introduced."
    handoff:
      known_context:
        - "Current planner format includes gem-reviewer fields but lists only plan, wave, or full in the reviewer handoff comment."
        - "The reviewer-contract task is the source of truth for critic inputs and output fields: critic_subject {objective, proposal, constraints, alternatives, evidence, decision_needed} and critic_context {audience, time_horizon, success_criteria, known_unknowns}."
      constraints:
        - "Make the smallest schema/guidance change that supports critic tasks."
        - "Do not alter the immutable plan acceptance criteria or remove existing mode compatibility."
    requires_review: true
    review_depth: lightweight
    review_security_sensitive: false

  - id: config-compatibility
    title: Preserve and redefine critic configuration compatibility
    description: >-
      Update .gem-team.yaml and any directly coupled configuration contract
      comments so planning.enable_critic_for remains parseable and keeps its
      [HIGH] default, but clearly means reviewer validation rather than a
      standalone gem-critic invocation.
    wave: 3
    agent: gem-implementer
    depends_on:
      - orchestrator-routing
      - planner-contract
    status: pending
    flags:
      requires_design_validation: false
      retries_used: 0
      revision_reason: ""
    acceptance_criteria:
      - ".gem-team.yaml retains planning.enable_critic_for: [HIGH] with the same key and value shape."
      - "Configuration comments describe the setting as complexity levels requiring gem-reviewer validation and do not claim a gem-critic agent is run."
      - "Existing unrelated orchestrator, model_routing, quality, devops, and testing settings are unchanged."
      - "The config contract remains compatible with existing users and the orchestrator routing semantics documented by orchestrator-routing."
    handoff:
      known_context:
        - "The current config comment says Run gem-critic and conflicts with the removed-agent compatibility requirement."
        - "The user explicitly requires preserving planning.enable_critic_for and redefining its meaning."
      constraints:
