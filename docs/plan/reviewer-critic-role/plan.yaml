    topic: gem-reviewer critic role and compatibility

  - id: package-and-doc-validation
    title: Validate contracts, package output, and documentation
    description: >-
      Perform final read-only validation of the completed contract, routing,
      configuration, and documentation changes. Confirm source and packaged
      agent definitions agree, existing review modes remain valid, critic
