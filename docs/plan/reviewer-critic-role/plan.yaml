        - "Keep edits limited to compatibility wording and any required contract annotation."
    requires_review: true
    review_depth: lightweight
    review_security_sensitive: false

  - id: documentation-references
    title: Align agent and configuration documentation
    description: >-
      Update current README, AGENTS.md, workflow, agent catalog, configuration,
