      retries_used: 0
      revision_reason: ""
    acceptance_criteria:
      - "README.md and docs/src/content/3.agents/1.index.md describe Reviewer as supporting plan, wave, full, and additive critic behavior."
      - "docs/src/content/2.guide/3.workflow.md describes routing for discuss, proposal, feature_idea, and challenge and preserves existing review behavior."
      - "docs/src/content/4.configuration/1.index.md documents planning.enable_critic_for as reviewer validation with its compatible default."
      - "AGENTS.md and docs/src/content/5.resources/4.local-development.md state that standalone gem-critic is removed while gem-reviewer provides the behavior."
      - "No current configuration or documentation instructs users to invoke a standalone gem-critic; historical CHANGELOG.md entries remain unchanged as history."
    handoff:
