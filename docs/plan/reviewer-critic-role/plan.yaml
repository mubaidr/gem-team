plan_id: reviewer-critic-role
objective: >-
  Expand gem-reviewer into a general critic role for discussions, proposals,
  feature ideas, and critical challenge while preserving plan, wave, and full
  review behavior and compatibility.
created_at: "2026-08-14"
created_by: gem-planner
status: pending
tldr: >-
  Add an additive critic contract, route the four critic intents through the
  existing reviewer, preserve enable_critic_for as reviewer validation, and
  align planner, configuration, and documentation references.

baseline:
  objective: >-
    Expand gem-reviewer into a general critic role while preserving
    plan/wave/full behavior.
  acceptance_criteria:
    - Existing plan|wave|full contracts remain valid.
    - Critic mode has explicit input and measurable output.
    - Routing and agent input references can invoke critic mode.
    - Docs/config accurately describe behavior.
    - Validation commands are explicit.
  captured_at: "2026-08-14"

