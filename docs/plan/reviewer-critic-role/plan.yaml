tech_stack:
  - name: Markdown agent contracts
    role: Agent definitions and orchestration input/output contracts
  - name: YAML
    role: Gem Team configuration and plan artifact format
  - name: Nuxt 4 documentation site
    role: User-facing agent and configuration documentation
  - name: APM
    role: Package compilation and validation
conventions:
  - Use ASCII-only text.
  - Preserve existing agent names and existing review mode names.
  - Use canonical task_definition and handoff fields for delegated input.
  - Use conventional documentation structure and existing validation commands.
constraints:
  hard:
    - Do not rename or remove plan, wave, or full review modes.
    - Do not add a standalone gem-critic agent.
    - Preserve planning.enable_critic_for and its [HIGH] default for compatibility.
    - Critic mode is read-only and must challenge ideas, assumptions, alternatives, and decision blockers.
    - Do not implement source changes as part of this planning task.
  soft:
    - Prefer additive fields and branch-specific validation over broad contract rewrites.
    - Keep documentation changes limited to current behavior and compatibility notes.
  compatibility:
    - Existing reviewer callers using plan, wave, or full must remain valid without critic-only fields.
    - Existing configuration with planning.enable_critic_for must parse and continue to trigger reviewer validation.
    - Existing generic reviewer output fields must remain available to existing consumers.
  security_requirements:
    - Critic mode must not mutate repository files or claim implementation completion.
    - Do not introduce secrets or executable external integrations.
architecture_snapshot:
  agent_contract: >-
    gem-reviewer is the single review and challenge agent. It currently parses
    plan, wave, and full modes and returns a common JSON review result.
  orchestration: >-
    gem-orchestrator detects intent, routes reviewer tasks, and declares the
    gem-reviewer task_definition fields in agent_input_reference.
  planning: >-
    gem-planner defines the durable DAG plan format and reviewer task handoff
    fields; it must recognize any additive critic mode contract.
  configuration: >-
    .gem-team.yaml retains planning.enable_critic_for: [HIGH], currently
    described as running the removed gem-critic behavior.
  documentation: >-
    README.md, AGENTS.md, workflow, agent, configuration, and local-development
    docs describe reviewer responsibilities and the removed standalone agent.
prior_decisions:
  - decision: Standalone gem-critic was removed.
    source: AGENTS.md and docs/src/content/5.resources/4.local-development.md
  - decision: Existing reviewer modes are plan, wave, and full.
    source: .apm/agents/gem-reviewer.agent.md
  - decision: planning.enable_critic_for remains enabled for HIGH complexity.
    source: .gem-team.yaml and task_definition.task_clarifications
